name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      # The Kotlin e2e suites compile and run the generated code with Gradle (jvmToolchain 17).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      # Go targets format generated sources and compile/run HTTP integrations.
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - run: pnpm install --frozen-lockfile
      # Packages type-check against each other's dist/, so build first.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm exec vitest run
      - run: pnpm e2e
