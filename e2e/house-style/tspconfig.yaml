emit:
  - "@tspgen/emitter-kotlin"
  - "@tspgen/emitter-typescript"
options:
  "@tspgen/emitter-kotlin":
    emitter-output-dir: "{project-root}/build/generated/tspgen"
    package: "com.example"
    packages:
      - namespace: "Shop.Graph"
        package: "com.example.graph"
    errors: thrown
    validation: true
    plugins: ["./tspgen/permissions.js"]
    targets:
      - "@tspgen/kotlin-ktor-server":
          grouping: per-namespace
          service-suffix: Api
          module: false
          nest-routes: true
  "@tspgen/emitter-typescript":
    emitter-output-dir: "{project-root}/ts/generated"
    layout: single-file
    errors: thrown
    targets:
      - "@tspgen/ts-nextjs-client":
          client-style: flat
          error-model: ErrorResponse
