emit:
  - "@abhigyakrishna/tspgen-kotlin"
  - "@abhigyakrishna/tspgen-typescript"
options:
  "@abhigyakrishna/tspgen-kotlin":
    emitter-output-dir: "{project-root}/build/generated/tspgen"
    package: "com.example"
    packages:
      - namespace: "Shop.Graph"
        package: "com.example.graph"
    errors: thrown
    features:
      validation: true
    plugins: ["./tspgen/permissions.ts"]
    targets:
      - "@abhigyakrishna/tspgen-kotlin-ktor-server":
          grouping: per-namespace
          service-suffix: Api
          features:
            module: false
            nest-routes: true
  "@abhigyakrishna/tspgen-typescript":
    emitter-output-dir: "{project-root}/ts/generated"
    layout: single-file
    errors: thrown
    targets:
      - "@abhigyakrishna/tspgen-ts-nextjs-client":
          client-style: flat
          error-model: ErrorResponse
          error-class: ApiError
          features:
            react-query: false
