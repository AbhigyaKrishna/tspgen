emit:
  - "@abhigyakrishna/tspgen-typescript"
options:
  "@abhigyakrishna/tspgen-typescript":
    emitter-output-dir: "{project-root}/../client/generated/flat"
    layout: single-file
    features:
      zod: true
      effect: true
    targets:
      - "@abhigyakrishna/tspgen-ts-nextjs-client":
          client-style: flat
          features:
            effect: true
            validate: true
