emit:
  - "@abhigyakrishna/tspgen-typescript"
options:
  "@abhigyakrishna/tspgen-typescript":
    emitter-output-dir: "{project-root}/../generated/flat"
    layout: single-file
    features:
      zod: true
    targets:
      - "@abhigyakrishna/tspgen-ts-nextjs-client":
          client-style: flat
          features:
            validate: true
