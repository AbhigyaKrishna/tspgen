emit:
  - "@abhigyakrishna/tspgen-kotlin"
options:
  "@abhigyakrishna/tspgen-kotlin":
    emitter-output-dir: "{project-root}/../build/generated/tspgen-client"
    package: "com.example.clientmodels"
    features:
      optional-presence: true
      untagged-unions: true
    targets:
      - "@abhigyakrishna/tspgen-kotlin-ktor-client":
          max-response-size: 128
          max-error-size: 64
          features:
            streaming: true
