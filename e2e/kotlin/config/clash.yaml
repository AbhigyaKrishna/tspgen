emit:
  - "@abhigyakrishna/tspgen-kotlin"
options:
  "@abhigyakrishna/tspgen-kotlin":
    emitter-output-dir: "{project-root}/../generated/clash"
    package: "com.example.clash"
    targets:
      - "@abhigyakrishna/tspgen-kotlin-ktor-server":
          output-dir: "{project-root}/../server/generated/clash"
      - "@abhigyakrishna/tspgen-kotlin-ktor-client":
          output-dir: "{project-root}/../client/generated/clash"
