emit:
  - "@abhigyakrishna/tspgen-kotlin"
options:
  "@abhigyakrishna/tspgen-kotlin":
    emitter-output-dir: "{project-root}/../generated/errors-none"
    package: "com.example.faults.none"
    targets:
      - "@abhigyakrishna/tspgen-kotlin-ktor-server":
          output-dir: "{project-root}/../server/generated/errors-none"
          error-body: none
          features:
            module: false
