emit:
  - "@abhigyakrishna/tspgen-kotlin"
options:
  "@abhigyakrishna/tspgen-kotlin":
    emitter-output-dir: "{project-root}/../generated/mapping"
    package: "com.example.ledger"
    scalar-style: value-class
    targets:
      - "@abhigyakrishna/tspgen-kotlin-ktor-server":
          output-dir: "{project-root}/../server/generated/mapping"
      - "@abhigyakrishna/tspgen-kotlin-ktor-client":
          output-dir: "{project-root}/../client/generated/mapping"
