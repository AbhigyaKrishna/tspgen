emit:
  - "@abhigyakrishna/tspgen-kotlin"
options:
  "@abhigyakrishna/tspgen-kotlin":
    emitter-output-dir: "{project-root}/../build/generated/tspgen-raw-streams"
    package: "com.example.rawstreams"
    features:
      raw-streams: true
    targets:
      - "@abhigyakrishna/tspgen-kotlin-ktor-server":
          routing-style: resources
          handler-shape: request-object
      - "@abhigyakrishna/tspgen-kotlin-ktor-client":
          max-response-size: 16
